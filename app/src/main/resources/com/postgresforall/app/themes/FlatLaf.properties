# PostgresForAll look, applied on top of every FlatLaf theme.
# Semantic colours (PFA.*) are defined per light / dark theme in the sibling files.

Component.arc = 8
Button.arc = 8
TextComponent.arc = 6
CheckBox.arc = 4
Component.focusWidth = 1
Component.innerFocusWidth = 0
Button.minimumWidth = 64

ScrollBar.showButtons = false
ScrollBar.width = 10
ScrollBar.thumbArc = 999
ScrollBar.trackArc = 999
ScrollBar.thumbInsets = 2,2,2,2

TabbedPane.showTabSeparators = false
TabbedPane.tabHeight = 30
TabbedPane.tabSelectionHeight = 2

Tree.rowHeight = 24
Tree.selectionArc = 6
List.selectionArc = 6
MenuItem.selectionArc = 6
MenuItem.selectionInsets = 0,4,0,4
PopupMenu.borderCornerRadius = 8

Table.rowHeight = 24
Table.showHorizontalLines = true
Table.showVerticalLines = true
Table.gridColor = $PFA.border
TableHeader.height = 26
TableHeader.separatorColor = $PFA.border
TableHeader.bottomSeparatorColor = $PFA.border

ToolBar.spacingBorder = 4,6,4,6
TitlePane.unifiedBackground = true
TitlePane.menuBarEmbedded = true
SplitPaneDivider.style = plain
SplitPane.dividerSize = 6

ProgressBar.arc = 999

# Text style classes (putClientProperty("FlatLaf.styleClass", "muted"))
[style]Label.muted = foreground: $PFA.muted
[style]Label.subtle = foreground: $PFA.subtle
[style]Label.danger = foreground: $PFA.danger
[style]Label.success = foreground: $PFA.success
[style]Label.sectionTitle = font: bold
[style]Button.danger = foreground: #ffffff; background: $PFA.danger; borderColor: $PFA.danger; focusedBorderColor: $PFA.danger
