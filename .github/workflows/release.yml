name: Release

# Builds the installers, smoke-tests each one by installing it, and publishes them.
#   Push a tag:      git tag v1.2.0 && git push origin v1.2.0   → builds and publishes a GitHub Release
#   Run by hand:     Actions → Release → Run workflow           → builds and tests; publishes only if asked
# Installer code and docs: installer/ (see installer/README.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (numbers only, e.g. 1.2.0)"
        required: true
        default: "1.1.0"
      publish:
        description: "Also create a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Version must look like 1.2.3 (got '$v')"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows MSI
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      - name: Build MSI (downloads WiX 3.14 on first use)
        run: ./gradlew :app:jpackageInstaller "-PappVersion=${{ needs.version.outputs.version }}" --no-daemon

      - name: Install, check, uninstall
        shell: pwsh
        run: >
          ./installer/windows/smoke-test.ps1
          app/build/installer/PostgresForAll-${{ needs.version.outputs.version }}-x64.msi
          -ExpectedVersion ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: installer-windows
          path: app/build/installer/*.msi

  macos:
    name: macOS DMG (Apple Silicon)
    needs: version
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      - name: Build DMG
        run: ./gradlew :app:jpackageInstaller "-PappVersion=${{ needs.version.outputs.version }}" --no-daemon

      - name: Mount, install, check
        run: >
          bash installer/macos/smoke-test.sh
          app/build/installer/PostgresForAll-${{ needs.version.outputs.version }}-arm64.dmg
          ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: installer-macos
          path: app/build/installer/*.dmg

  publish:
    name: GitHub Release
    needs: [version, windows, macos]
    if: github.ref_type == 'tag' || inputs.publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Collect installers and checksums
        run: |
          gh run download "${{ github.run_id }}" --dir dist
          mkdir release
          find dist -type f \( -name '*.msi' -o -name '*.dmg' \) -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish
        run: |
          gh release create "v${VERSION}" release/* \
            --title "PostgresForAll ${VERSION}" \
            --notes-file installer/RELEASE-NOTES.md \
            --target "${GITHUB_SHA}"
