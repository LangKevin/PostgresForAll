name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS (Apple Silicon) — build, tests, packaged app, GUI end-to-end
    runs-on: macos-14
    timeout-minutes: 40
    env:
      POSTGRESCONNECT_CONFIG: ${{ github.workspace }}/ci/ci.config.json
      PFA_MAC_CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: PostgreSQL via Homebrew (launchd job on :5444)
        run: bash ci/mac-postgres-setup.sh

      - name: Build and test (includes Mac-only launchd / Keychain / lsof tests)
        run: ./gradlew build --no-daemon

      - name: Package PostgresForAll.app
        run: |
          ./gradlew :app:jpackageImage --no-daemon
          ditto -c -k --keepParent app/build/jpackage/PostgresForAll.app PostgresForAll-macos-arm64.zip

      - name: Console check from the .app, with the PATH a Finder-launched app gets
        run: |
          set -o pipefail
          env -i HOME="$HOME" USER="$USER" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            POSTGRESCONNECT_CONFIG="$POSTGRESCONNECT_CONFIG" \
            app/build/jpackage/PostgresForAll.app/Contents/MacOS/PostgresForAll-check | tee check-output.txt
          grep -q "launchd service 'homebrew.mxcl.postgresql" check-output.txt

      - name: Packaged GUI starts and stays up
        run: |
          app/build/jpackage/PostgresForAll.app/Contents/MacOS/PostgresForAll > gui-launch.log 2>&1 &
          PID=$!
          sleep 15
          if kill -0 "$PID"; then echo "GUI running"; kill "$PID"; else echo "GUI exited"; cat gui-launch.log; exit 1; fi

      - name: GUI end-to-end test
        run: |
          ./gradlew :app:installDist --no-daemon
          java -cp "app/build/install/PostgresForAll/lib/*" tools/e2e/E2E.java e2e-screenshots

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-results
          path: |
            core/build/reports/tests/
            e2e-screenshots/
            check-output.txt
            gui-launch.log

      - name: Upload app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PostgresForAll-macos-arm64
          path: PostgresForAll-macos-arm64.zip

  windows:
    name: Windows — build, tests, packaged exe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test (live-DB tests skip - no server on this runner)
        run: ./gradlew build :app:jpackageImage --no-daemon

      - name: Console check runs
        shell: bash
        run: app/build/jpackage/PostgresForAll/PostgresForAll-check.exe --port 5999 || test $? -eq 2

      - uses: actions/upload-artifact@v4
        with:
          name: PostgresForAll-windows-x64
          path: app/build/jpackage/PostgresForAll/
